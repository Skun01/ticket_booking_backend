databaseChangeLog:
  - changeSet:
      id: 016-add-family-id-to-refresh-tokens
      author: truongtv
      changes:
        - addColumn:
            tableName: refresh_tokens
            columns:
              - column:
                  name: family_id
                  type: VARCHAR(36)
        - sql:
            dbms: mysql
            splitStatements: false
            stripComments: true
            sql: UPDATE refresh_tokens SET family_id = UUID() WHERE family_id IS NULL
        - addNotNullConstraint:
            tableName: refresh_tokens
            columnName: family_id
            columnDataType: VARCHAR(36)
        - createIndex:
            indexName: idx_refresh_tokens_family_id
            tableName: refresh_tokens
            columns:
              - column:
                  name: family_id
      rollback:
        - dropIndex:
            indexName: idx_refresh_tokens_family_id
            tableName: refresh_tokens
        - dropColumn:
            tableName: refresh_tokens
            columnName: family_id
