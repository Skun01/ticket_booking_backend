databaseChangeLog:
  - changeSet:
      id: 007-create-events-table
      author: init
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organizer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_organizer
                    references: users(id)
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_category
                    references: categories(id)
              - column:
                  name: venue_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_venue
                    references: venues(id)
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: banner_url
                  type: VARCHAR(500)
              - column:
                  name: start_time
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        # index phục vụ lọc sự kiện public theo trạng thái và thời gian bắt đầu
        - createIndex:
            tableName: events
            indexName: idx_events_status_start_time
            columns:
              - column:
                  name: status
              - column:
                  name: start_time
