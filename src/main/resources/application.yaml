spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sport_slot_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:My3qaTaqc3YzHsmjWIJ4b6+wHCkfMXkHt/Mlj7lkxSA=}
    issuer: ${spring.application.name}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-token-cleanup-cron: "0 0 3 * * *"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:[*]}"
  admin:
    email: ${ADMIN_EMAIL:thaitruong@admin.com}
    password: ${ADMIN_PASSWORD:12345678}
  organizer:
    email: ${ORGANIZER_EMAIL:thaitruong@organizer.com}
    password: ${ORGANIZER_PASSWORD:12345678}
  order:
    hold-minutes: ${ORDER_HOLD_MINUTES:15}
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    event-detail-ttl: ${CACHE_EVENT_DETAIL_TTL:30m}
  mail-sender:
    from: ${MAIL_FROM:no-reply@sportslot.local}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:order.exchange}
    mail-queue: ${RABBITMQ_MAIL_QUEUE:mail.queue}
    log-queue: ${RABBITMQ_LOG_QUEUE:log.queue}
    routing-key-paid: order.paid
    routing-key-cancelled: order.cancelled
    dead-letter-exchange: ${RABBITMQ_DEAD_LETTER_EXCHANGE:order.dlx}
    mail-dead-letter-queue: ${RABBITMQ_MAIL_DLQ:mail.dlq}
    log-dead-letter-queue: ${RABBITMQ_LOG_DLQ:log.dlq}
    consumer-max-retries: ${RABBITMQ_CONSUMER_MAX_RETRIES:2}
    consumer-retry-delay-millis: ${RABBITMQ_CONSUMER_RETRY_DELAY_MILLIS:1000}
    consumer-prefetch: ${RABBITMQ_CONSUMER_PREFETCH:10}
    declare-dead-letter-arguments: ${RABBITMQ_DECLARE_DEAD_LETTER_ARGUMENTS:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
