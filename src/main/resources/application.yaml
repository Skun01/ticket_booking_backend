spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sport_slot_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:My3qaTaqc3YzHsmjWIJ4b6+wHCkfMXkHt/Mlj7lkxSA=}
    issuer: ${spring.application.name}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-token-cleanup-cron: "0 0 3 * * *"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:[*]}"
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin12345}
  order:
    hold-minutes: ${ORDER_HOLD_MINUTES:15}
  mail-sender:
    from: ${MAIL_FROM:no-reply@sportslot.local}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:order.exchange}
    mail-queue: ${RABBITMQ_MAIL_QUEUE:mail.queue}
    log-queue: ${RABBITMQ_LOG_QUEUE:log.queue}
    routing-key-paid: order.paid
    routing-key-cancelled: order.cancelled

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
