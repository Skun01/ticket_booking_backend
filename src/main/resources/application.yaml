spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sport_slot_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:My3qaTaqc3YzHsmjWIJ4b6+wHCkfMXkHt/Mlj7lkxSA=}
    issuer: ${spring.application.name}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-token-cleanup-cron: "0 0 3 * * *"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:[*]}"
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:12345678}
  organizer:
    email: ${ORGANIZER_EMAIL:thaitruong@organizer.com}
    password: ${ORGANIZER_PASSWORD:12345678}
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    return-url: ${PAYOS_RETURN_URL:http://localhost:4200/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:4200/payment/cancel}
  order:
    hold-minutes: ${ORDER_HOLD_MINUTES:15}
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    event-detail-ttl: ${CACHE_EVENT_DETAIL_TTL:30m}
  mail-sender:
    from: ${MAIL_FROM:no-reply@sportslot.local}
  rabbitmq:
    listener:
      prefetch: ${RABBITMQ_CONSUMER_PREFETCH:10}
      max-retries: ${RABBITMQ_CONSUMER_MAX_RETRIES:2}
      retry-delay-millis: ${RABBITMQ_CONSUMER_RETRY_DELAY_MILLIS:1000}
      declare-dead-letter-arguments: ${RABBITMQ_DECLARE_DEAD_LETTER_ARGUMENTS:true}

    order-event:
      exchange: ${RABBITMQ_EXCHANGE:order.exchange}
      dead-letter-exchange: ${RABBITMQ_DEAD_LETTER_EXCHANGE:order.dlx}
      routing-key-paid: order.paid
      routing-key-cancelled: order.cancelled
      mail-queue: ${RABBITMQ_MAIL_QUEUE:mail.queue}
      mail-dead-letter-queue: ${RABBITMQ_MAIL_DLQ:mail.dlq}
      log-queue: ${RABBITMQ_LOG_QUEUE:log.queue}
      log-dead-letter-queue: ${RABBITMQ_LOG_DLQ:log.dlq}

    order-expiry:
      hold-exchange: ${RABBITMQ_HOLD_EXCHANGE:order.hold.exchange}
      hold-queue: ${RABBITMQ_HOLD_QUEUE:order.hold.queue}
      expire-queue: ${RABBITMQ_EXPIRE_QUEUE:order.expire.queue}
      expire-dead-letter-queue: ${RABBITMQ_EXPIRE_DLQ:order.expire.dlq}
      routing-key-hold: order.hold
      routing-key-expired: order.expired

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
